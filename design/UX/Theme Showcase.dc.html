<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="crossorigin" />
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Mukta:wght@400;500;600;700&family=DM+Mono:wght@400;500&family=Gilda+Display&family=Karla:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Archivo:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=Roboto+Mono:wght@400;500&family=Bodoni+Moda:wght@400;500&family=Jost:wght@300;400;500;600&family=Space+Mono:wght@400;700&family=Newsreader:wght@300;400;500&family=Nunito+Sans:wght@400;600;700&family=Courier+Prime:wght@400;700&family=Space+Grotesk:wght@400;500;700&family=Manrope:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  body { margin: 0; background: #0C0D0F; -webkit-font-smoothing: antialiased; }
  a { color: #E9A227; text-decoration: none; }
  a:hover { color: #F2B84B; }
  * { -webkit-tap-highlight-color: transparent; }
  @keyframes pulseDot { 0%, 100% { opacity: .45; } 50% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    * { transition-duration: 1ms !important; animation-duration: 1ms !important; }
  }
</style>
</helmet>

<div style="{{ rootStyle }}">

  <div class="switcher" style="position: relative; z-index: 20; display: flex; gap: 6px; padding: 10px 12px; overflow-x: auto; scrollbar-width: none; background: var(--surface, #1B2B45); border-bottom: var(--border-w, 1px) solid var(--line, #2A3A55); transition: background-color var(--dur, 300ms) var(--ease), border-color var(--dur, 300ms) var(--ease);">
    <sc-for list="{{ themes }}" as="t" hint-placeholder-count="6">
      <button onClick="{{ t.pick }}" style="{{ t.chipStyle }}" style-focus="outline: 2px solid var(--accent); outline-offset: 2px;">
        <span style="{{ t.dotStyle }}"></span>
        <span style="{{ t.chipLabelStyle }}">{{ t.name }}</span>
      </button>
    </sc-for>
  </div>

  <div class="screen" style="position: relative; flex: 1; min-height: 0; overflow: hidden; background: var(--bg, #101E33); transition: background-color var(--dur, 300ms) var(--ease);">

    <div class="texture" style="position: absolute; inset: 0; pointer-events: none; z-index: 1; background: var(--tex-css, none); opacity: var(--tex-op, 0); transition: opacity var(--dur, 300ms) var(--ease);"></div>

    <div class="scroll" style="position: absolute; inset: 0; z-index: 2; overflow-y: auto; overflow-x: hidden; padding: 20px 16px 108px 16px;">

      <div class="identity" style="display: flex; align-items: baseline; justify-content: space-between; gap: 12px;">
        <div class="identity-name" style="font-family: var(--f-display, Marcellus), serif; font-weight: var(--display-w, 400); letter-spacing: var(--display-tr, 0); font-size: var(--fs-xl, 24px); line-height: 1.1; color: var(--ink, #E3E5DB); transition: color var(--dur, 300ms) var(--ease);">{{ property }}</div>
        <div class="identity-room" style="font-family: var(--f-num, monospace); font-size: var(--fs-xs, 11px); letter-spacing: .1em; text-transform: uppercase; font-variant-numeric: tabular-nums; color: var(--accent-ink, #101E33); background: var(--accent, #E9A227); padding: 5px 9px; border-radius: var(--r-sm, 4px); white-space: nowrap; transition: background-color var(--dur, 300ms) var(--ease), color var(--dur, 300ms) var(--ease), border-radius var(--dur, 300ms) var(--ease);">Room 214</div>
      </div>

      <div class="greeting" style="font-family: var(--f-body, sans-serif); font-size: var(--fs-md, 15px); line-height: 1.5; color: var(--ink-muted, #8FA0B5); margin-top: 6px; transition: color var(--dur, 300ms) var(--ease);">Good evening, Anjali · Room 214</div>

      <div class="hero" style="position: relative; display: flex; flex-direction: var(--hero-dir, column); gap: var(--hero-gap, 0); align-items: stretch; min-height: var(--hero-min-h, 0); margin-top: 18px; overflow: hidden; background: var(--hero-bg, transparent); border: var(--hero-border, 0); border-radius: var(--r-lg, 20px); transition: background-color var(--dur, 300ms) var(--ease), border-radius var(--dur, 300ms) var(--ease), min-height var(--dur, 300ms) var(--ease);">
        <div class="hero-img" style="position: var(--hero-img-pos, absolute); inset: 0; display: var(--hero-img-display, block); width: var(--hero-img-w, 100%); height: var(--hero-img-h, 100%); flex: var(--hero-img-flex, 0 0 auto); aspect-ratio: var(--hero-ratio, 16/9); background: var(--img-ph, #16253E); border-radius: var(--hero-img-radius, 0); transition: width var(--dur, 300ms) var(--ease), border-radius var(--dur, 300ms) var(--ease);"></div>
        <div class="hero-scrim" style="position: absolute; inset: 0; background: var(--scrim, none); opacity: var(--scrim-op, 0); transition: opacity var(--dur, 300ms) var(--ease);"></div>
        <div class="hero-body" style="position: var(--hero-body-pos, relative); z-index: 2; flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: var(--hero-body-just, flex-end); padding: var(--hero-body-pad, 18px);">
          <div class="hero-kicker" style="font-family: var(--f-num, monospace); font-size: var(--fs-xs, 11px); letter-spacing: .14em; text-transform: uppercase; color: var(--hero-kicker-ink, #6E9C95); transition: color var(--dur, 300ms) var(--ease);">{{ heroKicker }}</div>
          <div class="hero-title" style="font-family: var(--f-display, serif); font-weight: var(--display-w, 400); letter-spacing: var(--display-tr, 0); font-size: var(--fs-lg, 19px); line-height: 1.2; margin-top: 5px; color: var(--hero-ink, #E3E5DB); text-wrap: pretty; transition: color var(--dur, 300ms) var(--ease);">{{ heroTitle }}</div>
        </div>
      </div>

      <div class="status" style="display: flex; align-items: center; gap: 10px; min-height: 52px; margin-top: 14px; padding: 0 14px; background: var(--surface-raised, #1B2B45); border: var(--border-w, 1px) solid var(--line, #2A3A55); border-radius: var(--r-md, 12px); transition: background-color var(--dur, 300ms) var(--ease), border-color var(--dur, 300ms) var(--ease), border-radius var(--dur, 300ms) var(--ease);">
        <span class="status-dot" style="width: 8px; height: 8px; flex: 0 0 8px; border-radius: 999px; background: var(--positive, #6E9C95); animation: pulseDot 2.6s ease-in-out infinite; transition: background-color var(--dur, 300ms) var(--ease);"></span>
        <span class="status-label" style="font-family: var(--f-body, sans-serif); font-size: var(--fs-sm, 13.5px); font-weight: 600; color: var(--ink, #E3E5DB); transition: color var(--dur, 300ms) var(--ease);">{{ statusLabel }}</span>
        <span class="status-meta" style="margin-left: auto; font-family: var(--f-num, monospace); font-size: var(--fs-sm, 13px); font-variant-numeric: tabular-nums; color: var(--ink-muted, #8FA0B5); transition: color var(--dur, 300ms) var(--ease);">{{ statusMeta }}</span>
      </div>

      <div class="dests" style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px;">
        <sc-for list="{{ dests }}" as="d" hint-placeholder-count="5">

            <span style="display: flex; flex-direction: column; align-items: flex-start; gap: 3px;">
              <span style="font-family: var(--f-body, sans-serif); font-size: var(--fs-md, 15.5px); font-weight: 600; line-height: 1.2; color: var(--ink, #E3E5DB);">{{ d.title }}</span>
              <span style="font-family: var(--f-num, monospace); font-size: var(--fs-xs, 10.5px); letter-spacing: .07em; text-transform: uppercase; color: var(--ink-muted, #8FA0B5);">{{ d.sub }}</span>
            </span>
          </button>
        </sc-for>
      </div>

      <div class="rail-head" style="display: flex; align-items: baseline; justify-content: space-between; margin-top: 26px;">
        <div style="font-family: var(--f-display, serif); font-weight: var(--display-w, 400); letter-spacing: var(--display-tr, 0); font-size: var(--fs-lg, 20px); color: var(--ink, #E3E5DB); transition: color var(--dur, 300ms) var(--ease);">{{ railTitle }}</div>
        <div style="font-family: var(--f-num, monospace); font-size: var(--fs-xs, 10.5px); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-muted, #8FA0B5);">Tonight</div>
      </div>

      <div class="rail" style="display: flex; gap: 12px; margin: 12px -16px 0 -16px; padding: 0 16px 4px 16px; overflow-x: auto; scrollbar-width: none;">
        <sc-for list="{{ rail }}" as="c" hint-placeholder-count="3">
          <div style="{{ c.cardStyle }}">
            <div style="{{ c.imgStyle }}"></div>
            <div style="padding: 10px 12px 12px 12px;">
              <div style="font-family: var(--f-body, sans-serif); font-size: var(--fs-sm, 14px); font-weight: 600; line-height: 1.25; color: var(--ink, #E3E5DB); text-wrap: pretty;">{{ c.title }}</div>
              <div style="font-family: var(--f-num, monospace); font-size: var(--fs-xs, 11px); font-variant-numeric: tabular-nums; color: var(--ink-muted, #8FA0B5); margin-top: 4px;">{{ c.meta }}</div>
            </div>
          </div>
        </sc-for>
      </div>

      <div class="checkout" style="display: flex; align-items: center; gap: 12px; min-height: 60px; margin-top: 22px; padding: 12px 14px; background: var(--surface, #1B2B45); border: var(--border-w, 1px) solid var(--line, #2A3A55); border-radius: var(--r-md, 12px); transition: background-color var(--dur, 300ms) var(--ease), border-color var(--dur, 300ms) var(--ease), border-radius var(--dur, 300ms) var(--ease);">
        <div style="flex: 1; min-width: 0;">
          <div style="font-family: var(--f-body, sans-serif); font-size: var(--fs-sm, 14px); font-weight: 600; color: var(--ink, #E3E5DB);">Checking out Thursday, 11am</div>
          <div style="font-family: var(--f-num, monospace); font-size: var(--fs-xs, 11px); font-variant-numeric: tabular-nums; color: var(--ink-muted, #8FA0B5); margin-top: 3px;">{{ rateLine }}</div>
        </div>
        <button style="{{ lateBtnStyle }}" style-focus="outline: 2px solid var(--accent); outline-offset: 2px;">Request late checkout</button>
      </div>
    </div>

    <div class="bottombar" style="position: absolute; left: 0; right: 0; bottom: 0; z-index: 10; display: flex; align-items: center; gap: 12px; padding: 12px 16px 16px 16px; background: var(--bar-bg, rgba(16,30,51,.94)); border-top: var(--border-w, 1px) solid var(--line, #2A3A55); backdrop-filter: blur(14px); transition: background-color var(--dur, 300ms) var(--ease), border-color var(--dur, 300ms) var(--ease);">

        <div style="font-family: var(--f-num, monospace); font-size: var(--fs-xs, 10.5px); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-muted, #8FA0B5);">Folio so far</div>

      </div>
      <button style="{{ primaryStyle }}" style-focus="outline: 2px solid var(--ink); outline-offset: 3px;">{{ primaryLabel }}</button>
    </div>
  </div>
</div>

    '--hero-img-pos': 'absolute', '--hero-img-display': 'block', '--hero-img-w': '100%', '--hero-img-h': '100%', '--hero-img-flex': '0 0 auto', '--hero-img-radius': '0px',
    '--hero-body-pos': 'relative', '--hero-body-just': 'flex-end', '--hero-body-pad': '18px',
    '--scrim-op': '1', '--hero-bg': 'transparent', '--hero-border': '0'
  },
  editorial: {
    '--hero-dir': 'row', '--hero-gap': '14px', '--hero-min-h': '0px',
    '--hero-img-pos': 'relative', '--hero-img-display': 'block', '--hero-img-w': '42%', '--hero-img-h': 'auto', '--hero-img-flex': '0 0 42%', '--hero-img-radius': 'var(--r-sm)',
    '--hero-body-pos': 'relative', '--hero-body-just': 'center', '--hero-body-pad': '16px 16px 16px 0',
    '--scrim-op': '0', '--hero-bg': 'var(--surface)', '--hero-border': 'var(--border-w) solid var(--line)'
  },
  compact: {
    '--hero-dir': 'column', '--hero-gap': '0', '--hero-min-h': '0px',
    '--hero-img-pos': 'relative', '--hero-img-display': 'none', '--hero-img-w': '0%', '--hero-img-h': 'auto', '--hero-img-flex': '0 0 0%', '--hero-img-radius': '0px',
    '--hero-body-pos': 'relative', '--hero-body-just': 'flex-start', '--hero-body-pad': '16px 16px 18px 16px',
    '--scrim-op': '0', '--hero-bg': 'var(--surface)', '--hero-border': 'var(--border-w) solid var(--line)'
  }
};

class Component extends DCLogic {
  state = { key: null };

  pick = (key) => () => this.setState({ key });

  vars(t) {
    const c = t.color, ty = t.type, sh = t.shape, im = t.image, mo = t.motion, tx = t.texture;
    const r = ty.scaleRatio, base = 15;
    const px = (n) => Math.round(n * 10) / 10 + 'px';
    const o = {
      '--bg': c.bg, '--surface': c.surface, '--surface-raised': c.surfaceRaised,
      '--ink': c.ink, '--ink-muted': c.inkMuted, '--line': c.line,
      '--accent': c.accent, '--accent-ink': c.accentInk,
      '--positive': c.positive, '--warning': c.warning, '--critical': c.critical,
      '--f-display': "'" + ty.display + "'", '--f-body': "'" + ty.body + "'", '--f-num': "'" + ty.numeric + "'",
      '--display-w': ty.displayWeight, '--display-tr': ty.displayTracking,
      '--fs-xs': px(Math.max(11, base / (r * r))), '--fs-sm': px(Math.max(12.5, base / r)), '--fs-md': px(base),
      '--fs-lg': px(base * r), '--fs-xl': px(base * r * r), '--fs-display': px(base * r * r * r),
      '--r-sm': sh.radiusSm, '--r-md': sh.radiusMd, '--r-lg': sh.radiusLg, '--r-pill': sh.radiusPill, '--border-w': sh.borderWidth,
      '--hero-ratio': im.heroRatio, '--card-ratio': im.cardRatio,
      '--scrim': im.scrim, '--img-ph': im.placeholderStyle,
      '--dur': mo.duration, '--ease': mo.easing,
      '--tex-css': tx.css, '--tex-op': String(tx.opacity),
      '--bar-bg': c.surface,
      '--hero-ink': t.heroStyle === 'cinematic' ? '#FFFFFF' : c.ink,
      '--hero-kicker-ink': t.heroStyle === 'cinematic' ? 'rgba(255,255,255,.78)' : c.accent
    };
    Object.assign(o, HERO[t.heroStyle]);
    return Object.keys(o).map(k => k + ':' + o[k]).join(';') + ';';
  }

  renderVals() {
    const key = this.state.key || this.props.theme || 'heritage';
    const t = THEMES.find(x => x.themeKey === key) || THEMES[0];
    const c = t.color, k = t.content;
    const trans = 'transition:background-color var(--dur) var(--ease),color var(--dur) var(--ease),border-color var(--dur) var(--ease),border-radius var(--dur) var(--ease);';

    return {
      rootStyle: 'width:390px;height:844px;margin:0 auto;display:flex;flex-direction:column;overflow:hidden;position:relative;font-family:var(--f-body);color:var(--ink);' + this.vars(t),

      themes: THEMES.map(x => {
        const on = x.themeKey === key;
        return {
          key: x.themeKey, name: x.name, pick: this.pick(x.themeKey),
          chipStyle: 'display:flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border-radius:var(--r-pill);cursor:pointer;white-space:nowrap;background:' + (on ? 'var(--accent)' : 'transparent') + ';border:var(--border-w) solid ' + (on ? 'transparent' : 'var(--line)') + ';' + trans,
          dotStyle: 'width:9px;height:9px;border-radius:999px;flex:0 0 9px;background:' + x.color.accent + ';box-shadow:0 0 0 1px rgba(0,0,0,.18) inset;',
          chipLabelStyle: 'font-family:var(--f-body);font-size:13px;font-weight:600;color:' + (on ? 'var(--accent-ink)' : 'var(--ink-muted)') + ';' + trans
        };
      }),

      property: t.name, heroKicker: k.heroKicker, heroTitle: k.heroTitle,
      statusLabel: k.statusLabel, statusMeta: k.statusMeta, railTitle: k.railTitle,
      rateLine: inr(k.rate) + ' a night · room 214',
      folio: inr(k.folio), primaryLabel: k.primary,

      dests: DESTS.map(d => ({
        key: d.id, title: d.title, sub: d.sub,
        style: 'display:flex;align-items:center;gap:12px;min-height:64px;padding:12px 14px;text-align:left;cursor:pointer;background:var(--surface);border:var(--border-w) solid var(--line);border-radius:var(--r-md);grid-column:' + (d.wide ? 'span 2' : 'span 1') + ';' + trans,
        markStyle: 'width:10px;height:26px;flex:0 0 10px;border-radius:var(--r-sm);background:' + (d.wide ? 'var(--accent)' : 'var(--line)') + ';' + trans
      })),

      rail: k.rail.map((row, i) => ({
        key: 'r' + i, title: row[0], meta: row[1],
        cardStyle: 'flex:0 0 210px;width:210px;background:var(--surface);border:var(--border-w) solid var(--line);border-radius:var(--r-md);overflow:hidden;' + trans,
        imgStyle: 'width:100%;aspect-ratio:var(--card-ratio);background:var(--img-ph);'
      })),

      lateBtnStyle: 'min-height:44px;padding:0 14px;cursor:pointer;background:transparent;border:var(--border-w) solid var(--accent);border-radius:var(--r-sm);color:var(--accent);font-family:var(--f-body);font-size:13px;font-weight:700;white-space:nowrap;' + trans,
      primaryStyle: 'min-height:52px;padding:0 22px;cursor:pointer;background:var(--accent);border:0;border-radius:var(--r-pill);color:var(--accent-ink);font-family:var(--f-body);font-size:16px;font-weight:700;white-space:nowrap;' + trans
    };
  }
}

</script>
</body>
</html>
