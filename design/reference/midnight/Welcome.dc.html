<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The Kesari — Welcome</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&amp;family=Manrope:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0A0C11}
a{color:#E3BE7E}a:hover{color:#F1D7A6}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; background: radial-gradient(90% 45% at 50% 46%, rgba(214,168,92,0.16) 0%, rgba(10,12,17,0) 70%), #0A0C11; color: #F3EEE4; font-family: 'Manrope', system-ui, sans-serif; -webkit-font-smoothing: antialiased; display: flex; flex-direction: column; align-items: center; padding: 30px 24px 28px">

  <div style="display: flex; align-items: center; gap: 10px">
    <svg width="18" height="22" viewBox="0 0 22 26" fill="none" aria-hidden="true"><path d="M1 25V11C1 5.5 5.5 1 11 1s10 4.5 10 10v14" stroke="{{accent}}" stroke-width="1.2"></path><circle cx="11" cy="18" r="2" fill="{{accent}}"></circle></svg>
    <span style="font-family: 'Cormorant Garamond', serif; font-size: 15px; font-weight: 600; letter-spacing: 0.34em">THE KESARI</span>
  </div>

  <!-- Arch with key -->
  <div style="position: relative; width: 220px; height: 290px; margin-top: 56px; display: flex; align-items: center; justify-content: center">
    <div style="position: absolute; top: 0; left: 0; right: 0; bottom: 0; border-radius: 110px 110px 6px 6px; border: 1px solid {{accent}}; opacity: 0.85"></div>
    <div style="position: absolute; top: 18px; left: 18px; right: 18px; bottom: 0; border-radius: 92px 92px 0 0; border: 1px solid rgba(232,213,176,0.18); border-bottom: none"></div>
    <div style="position: absolute; top: 36px; left: 36px; right: 36px; bottom: 0; border-radius: 74px 74px 0 0; background: radial-gradient(100% 60% at 50% 100%, rgba(214,168,92,0.42) 0%, rgba(214,168,92,0.06) 55%, rgba(18,21,28,0) 80%), #12151C"></div>
    <div style="position: relative; display: flex; flex-direction: column; align-items: center; gap: 14px; margin-top: 40px">
      <div style="width: 72px; height: 72px; border-radius: 36px; background: {{accent}}; color: #1A1408; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 10px rgba(214,168,92,0.12), 0 0 0 22px rgba(214,168,92,0.05)">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="15" r="4"></circle><path d="M10.8 12.2 20 3"></path><path d="m16 7 3 3"></path><path d="m18.5 4.5 2 2"></path></svg>
      </div>
      <span style="font-size: 11px; font-weight: 600; letter-spacing: 0.2em; text-transform: uppercase; color: #E3C48E">Key ready</span>
    </div>
  </div>

  <div style="text-align: center; margin-top: 36px">
    <span style="font-size: 11px; font-weight: 600; letter-spacing: 0.22em; text-transform: uppercase; color: #C9B48E">You're checked in</span>
    <h1 style="margin: 12px 0 0; font-family: 'Cormorant Garamond', serif; font-weight: 500; font-size: 42px; line-height: 1.04; color: #F6F1E7">Welcome home,<br><span style="font-style: italic; color: #EBD3A6">Thomas</span></h1>
    <p style="margin: 14px auto 0; max-width: 290px; font-size: 14px; line-height: 1.5; color: #B3B5BE">Your suite is ready, and your key now lives on this phone.</p>
  </div>

  <div style="width: 100%; margin-top: 28px; border-radius: 20px; background: #12151C; border: 1px solid rgba(232,213,176,0.10); display: grid; grid-template-columns: repeat(3, minmax(0, 1fr))">
    <div style="padding: 14px 12px; text-align: center; border-right: 1px solid rgba(232,213,176,0.08)">
      <div style="font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: #8E919C">Suite</div>
      <div style="font-family: 'Cormorant Garamond', serif; font-size: 24px; font-weight: 600; margin-top: 2px; color: #F6F1E7">105</div>
    </div>
    <div style="padding: 14px 12px; text-align: center; border-right: 1px solid rgba(232,213,176,0.08)">
      <div style="font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: #8E919C">Nights</div>
      <div style="font-family: 'Cormorant Garamond', serif; font-size: 24px; font-weight: 600; margin-top: 2px; color: #F6F1E7">4</div>
    </div>
    <div style="padding: 14px 12px; text-align: center">
      <div style="font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: #8E919C">Check-out</div>
      <div style="font-family: 'Cormorant Garamond', serif; font-size: 24px; font-weight: 600; margin-top: 2px; color: #F6F1E7">Sun 11:00</div>
    </div>
  </div>

  <div style="flex: 1"></div>

  <a href="Main.dc.html" style="width: 100%; height: 60px; border-radius: 18px; background: {{accent}}; color: #1A1408; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 16px; font-weight: 700; box-shadow: 0 12px 32px rgba(214,168,92,0.22)">
    Enter your stay
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><path d="m13 6 6 6-6 6"></path></svg>
  </a>
  <a href="#" style="margin-top: 10px; height: 44px; display: flex; align-items: center; font-size: 14px; font-weight: 600; text-decoration: none">Speak to the front desk</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#D6A85C","options":["#D6A85C","#C98A4B","#B9C2D6","#9FB59A"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#D6A85C' };
  }
}
</script>
</body>
</html>
