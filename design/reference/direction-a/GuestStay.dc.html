<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Your stay</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&amp;family=Marcellus&amp;family=Mukta:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
:root{--g-page:#0A1220;--g-surface:#101E33;--g-card:#1B2B45;--g-line:#2A3B58;--g-ink:#F4ECDD;--g-ink-2:#B9C2D0;--g-ink-3:#8B97AB;--g-accent:#E9A227;--g-on-accent:#1A1206;--g-ready:#6E9C95;--f-display:'Marcellus',Georgia,serif;--f-body:'Mukta',system-ui,sans-serif;--f-mono:'DM Mono',ui-monospace,monospace}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--g-ink-3)}
button{font-family:inherit}
a{color:inherit}
</style>
</helmet>
<div style="width:390px;height:844px;background:var(--g-page);color:var(--g-ink);font-family:var(--f-body);display:flex;flex-direction:column;overflow:hidden">

  <header style="padding:44px 8px 0;height:100px;box-sizing:border-box;display:flex;align-items:center">
    <a href="GuestHome.dc.html" aria-label="Back to room home" style="width:44px;height:44px;display:flex;align-items:center;justify-content:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#F4ECDD" stroke-width="1.5" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></a>
  </header>

  <div style="padding:0 20px;display:flex;flex-direction:column;gap:16px">
    <h1 style="margin:0;font-family:var(--f-display);font-weight:400;font-size:32px">Your stay</h1>

    <section style="background:var(--g-surface);border:1px solid var(--g-line);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:14px">
      <div style="display:flex;justify-content:space-between;align-items:flex-end">
        <span style="display:flex;flex-direction:column;gap:2px"><span class="eyebrow">Checking out</span><span style="font-family:var(--f-display);font-size:24px">Thu 5 Nov, <span class="mono" style="font-size:22px">11am</span></span></span>
        <span style="font-size:13px;color:var(--g-ink-2)">3 nights left</span>
      </div>
      <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px">
        <button style="min-height:56px;border:1px solid var(--g-line);background:transparent;color:var(--g-ink);border-radius:4px;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;padding:6px 12px"><span class="mono" style="font-size:15px">1pm</span><span style="font-size:12px;color:#9CC4BD">On us, if a room is free</span></button>
        <button style="min-height:56px;border:1px solid var(--g-line);background:transparent;color:var(--g-ink);border-radius:4px;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;padding:6px 12px"><span class="mono" style="font-size:15px">4pm</span><span class="mono" style="font-size:12px;color:var(--g-ink-2)">₹6,500</span></button>
      </div>
    </section>

    <section style="background:var(--g-surface);border:1px solid var(--g-line);border-radius:10px;padding:18px;display:flex;align-items:center;justify-content:space-between;gap:12px">
      <span style="display:flex;flex-direction:column;gap:4px"><span class="eyebrow">Bill so far</span><span class="mono" style="font-size:24px;letter-spacing:.06em;color:var(--g-ink-3)" aria-label="Hidden until you unlock">₹ ••,•••</span></span>
      <button style="height:48px;padding:0 16px;border:1px solid var(--g-accent);background:transparent;color:var(--g-accent);border-radius:4px;font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#E9A227" stroke-width="1.75" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="1"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>Show</button>
    </section>

    <section style="display:flex;flex-direction:column">
      <span class="eyebrow" style="margin-bottom:4px">The hotel</span>
      <div style="display:flex;align-items:center;justify-content:space-between;min-height:64px;border-bottom:1px solid var(--g-line)">
        <span style="display:flex;flex-direction:column"><span style="font-size:13px;color:var(--g-ink-3)">Wi-Fi · Kesari-Guest</span><span class="mono" style="font-size:17px">jharokha1847</span></span>
        <button style="height:44px;padding:0 14px;border:1px solid var(--g-line);background:transparent;color:var(--g-ink);border-radius:4px;font-size:14px;display:flex;align-items:center;gap:6px"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#F4ECDD" stroke-width="1.5" aria-hidden="true"><rect x="8" y="8" width="13" height="13" rx="1"></rect><path d="M16 8V4a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1v11a1 1 0 0 0 1 1h4"></path></svg>Copy</button>
      </div>
      <div style="display:flex;align-items:center;justify-content:space-between;min-height:56px;border-bottom:1px solid var(--g-line);font-size:15px"><span>Breakfast · courtyard</span><span class="mono" style="font-size:14px;color:var(--g-ink-2)">7–10:30am</span></div>
      <div style="display:flex;align-items:center;justify-content:space-between;min-height:56px;border-bottom:1px solid var(--g-line);font-size:15px"><span>Rooftop pool</span><span class="mono" style="font-size:14px;color:var(--g-ink-2)">7am–8pm</span></div>
    </section>
  </div>

  <div style="margin-top:auto;padding:12px 20px 34px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px">
    <a href="#" style="text-decoration:none;height:52px;border:1px solid var(--g-ink-3);border-radius:4px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:15px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F4ECDD" stroke-width="1.5" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2Z"></path></svg>Call the desk</a>
    <a href="#" style="text-decoration:none;height:52px;border:1px solid var(--g-ink-3);border-radius:4px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:15px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F4ECDD" stroke-width="1.5" aria-hidden="true"><path d="M21 12a9 9 0 0 1-13.4 7.8L3 21l1.2-4.6A9 9 0 1 1 21 12Z"></path></svg>WhatsApp us</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
